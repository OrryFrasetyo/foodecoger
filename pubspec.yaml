name: submission
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  camera: ^0.12.0+1
  firebase_ai: ^3.14.1
  firebase_app_check: ^0.4.5+2
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  image: ^4.9.1
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/labels/probability-labels-en.txt

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
